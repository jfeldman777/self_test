<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Описание системы</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .help-page { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    .help-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a365d; }
    .back-link { display: inline-block; margin-bottom: 24px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }
    .help-page h2 { font-size: 1.1rem; margin: 20px 0 12px 0; color: #1a365d; }
    .help-page ul { margin: 0; padding-left: 24px; line-height: 1.7; }
    .help-page p { margin: 0 0 12px 0; line-height: 1.6; }

<body>
  <div class="container">
    <div class="help-page">
      <a href="index.html" class="back-link">← Назад к игре</a>
      <h1 class="help-title">Описание системы</h1>

      <h2>Расставь элементы правильно</h2>
      <p>Игра на drag-and-drop: нужно расставить элементы таблицы в правильном порядке.</p>
      <ul>
        <li>Нажмите <strong>ИГРА</strong> — элементы перемешаются.</li>
        <li>Перетаскивайте ячейки, меняя их местами.</li>
        <li>Нажмите <strong>ГОТОВО</strong> — система проверит правильность.</li>
       
      </ul>

      

      
    </div>
  </div>
