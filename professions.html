<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корректировка профессий</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<header class="top-nav">
  <div class="top-nav__brand">Корректировка профессий</div>
  <div class="top-nav__actions">
    <a class="btn" href="dict.html">Словари</a>
    <select class="btn lang-select" id="lang-select" onchange="changeLanguage(this.value)" title="Выбрать язык">
      <option value="ru">Русский</option>
      <option value="en">English</option>
    </select>
    <a class="btn" href="index.html">Домой</a>
    <button class="btn" id="add-prof-btn">Добавить</button>
    <button class="btn" id="save-prof-btn">Сохранить</button>
    <button class="btn" id="export-prof-btn">Экспорт</button>
  </div>
</header>

<main>
  <p>Выберите профессию, отредактируйте значения по тестам или добавьте новую. Сохраните изменения и при выходе из режима экспортируйте файл.</p>
  <div id="prof-editor" class="prof-editor-layout">
    <div id="prof-list" class="prof-list-panel"></div>
    <div id="prof-form" class="prof-form-panel"></div>
  </div>
</main>

</body>
</html>
