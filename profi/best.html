<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лучшая профессия</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .best-page { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .best-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a365d; }
    .profi-row { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
    .profi-row-child { position: relative; margin-left: 14px; padding-left: 8px; }
    .profi-row-child::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 2px; background: #94a3b8; border-radius: 1px; }
    .profi-name { flex: 1; min-width: 180px; font-weight: 500; }
    .profi-options { display: flex; gap: 16px; }
    .profi-options label { cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .profi-options input { cursor: pointer; }
    .btn-row { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 12px 20px; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; color: white; }
    .back-link { margin-top: 16px; display: inline-block; color: #2563eb; text-decoration: none; font-weight: 500; }
    .result-block { margin-top: 24px; }
    .result-block h3 { margin: 0 0 12px 0; font-size: 1.1rem; }
    .best-desc { color: #64748b; margin-bottom: 16px; }
    .fail-block { margin-bottom: 16px; padding: 12px; border-radius: 8px; }
    .fail-block.nado { background: #fef2f2; border-left: 4px solid #dc2626; }
    .fail-block.katastrofa { background: #fff7ed; border-left: 4px solid #ea580c; }
    .fail-block .fail-desc { margin: 0 0 12px 0; font-size: 0.9rem; line-height: 1.5; }
    .prof-name { text-transform: uppercase; color: #2563eb; font-weight: 600; }
    .fail-list { margin: 0; padding-left: 20px; }
    .fail-list li { margin: 4px 0; }
    .hobby-block { background: #f0fdf4; padding: 16px; border-radius: 8px; margin-top: 16px; border-left: 4px solid #16a34a; }
    .hobby-block h4 { margin: 0 0 8px 0; font-size: 1rem; }
    .home-link { display: inline-block; margin-top: 20px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .home-link:hover { text-decoration: underline; }
    .market-banner { margin-bottom: 12px; padding: 8px 12px; background: #e0f2fe; border-radius: 6px; font-size: 0.9rem; }
    .market-banner a { color: #0369a1; font-weight: 500; }
    .home-link { display: inline-block; margin-bottom: 12px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .home-link:hover { text-decoration: underline; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: white; padding: 24px; border-radius: 12px; max-width: 500px; max-height: 80vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 16px 0; font-size: 1.1rem; }
    .modal-close { margin-top: 16px; margin-right: 8px; padding: 8px 16px; background: #64748b; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .modal-prof { margin-top: 16px; margin-right: 8px; padding: 8px 16px; background: #0369a1; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .sum-list { list-style: none; padding: 0; margin: 0; }
    .sum-list li { padding: 8px 0; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px; }
    .sum-list .sum-name { flex: 1; }
    .sum-list .sum-val { min-width: 60px; }
    .prof-list { list-style: none; padding: 0; margin: 0; }
    .prof-list li { padding: 6px 0; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="best-page">
    <a href="index.html" class="home-link">На главную страницу</a>
    <div id="market-banner" class="market-banner"></div>
    <h1 class="best-title">ЛУЧШАЯ ПРОФЕССИЯ</h1>
    <p class="best-desc">Выберите для каждой профессии: хочу / не хочу / не учитывать. Алгоритм найдёт лучший вариант с учётом востребованности.</p>
    <div id="best-form"></div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btn-find">Найти лучшую</button>
      <button type="button" class="btn btn-secondary" id="btn-extra" style="display: none;">ДОПОЛНИТЕЛЬНО</button>
      <a href="index.html" class="btn btn-secondary">Назад</a>
    </div>
    <div id="best-result" class="result-block" style="display: none;"></div>
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h3>Сумма по позициям</h3>
        <ul id="modal-sum-list" class="sum-list"></ul>
        <div>
          <button type="button" class="modal-close" id="modal-close">Закрыть</button>
          <button type="button" class="modal-prof" id="modal-prof">ПРОФЕССИЯ</button>
        </div>
      </div>
    </div>
    <div id="prof-modal-overlay" class="modal-overlay" style="display: none;">
      <div class="modal">
        <h3 id="prof-modal-title">Параметры профессии</h3>
        <ul id="prof-modal-list" class="prof-list"></ul>
        <button type="button" class="modal-close" id="prof-modal-close">Закрыть</button>
      </div>
    </div>
  </div>
  <script>
    const STORAGE_KEY = 'profiStatusOverrides';
    const EXCLUDE_GROUPS = ['СТАТУС', 'ЗАРПЛАТА'];
    const getName = p => typeof p === 'string' ? p : (p && p.name) || '';
    let profiData = null;
    let cardData = null;
    let marketData = null;
    let flatAbilities = [];
    let lastBestRes = null;

    function mergeProfi(profi) {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        const overrides = s ? JSON.parse(s) : {};
        Object.keys(overrides).forEach(id => {
          if (profi.professions[id] && typeof profi.professions[id] === 'object') {
            profi.professions[id].market_score = overrides[id].market_score ?? profi.professions[id].market_score;
          }
        });
      } catch (e) {}
      return profi;
    }

    function flattenCard(cardByGroup) {
      if (!cardByGroup || Array.isArray(cardByGroup)) return null;
      const flat = [];
      profiData.abilityGroups.forEach(group => {
        if (EXCLUDE_GROUPS.includes(group.name)) return;
        group.abilities.forEach(ability => {
          const raw = cardByGroup[group.name]?.[ability];
          const num = Number(raw);
          flat.push(!Number.isNaN(num) ? num : 0);
        });
      });
      return flat;
    }

    function buildFlatAbilities() {
      flatAbilities = [];
      profiData.abilityGroups.forEach(group => {
        if (EXCLUDE_GROUPS.includes(group.name)) return;
        group.abilities.forEach(ability => {
          flatAbilities.push({ group: group.name, name: ability });
        });
      });
    }

    function dist(a, b) {
      let s = 0;
      for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) * (a[i] - b[i]);
      return Math.sqrt(s);
    }

    function computeDeltaForProfession(evalId, choices) {
      const target = flattenCard(cardData[evalId]);
      if (!target) return null;
      const professions = profiData.professions;
      const sum = new Array(target.length).fill(0);
      let totalCount = 0;
      Object.keys(choices).forEach(id => {
        if (!cardData[id] || id === evalId) return;
        const choice = choices[id];
        if (choice === 'skip') return;
        const vals = flattenCard(cardData[id]);
        if (!vals) return;
        totalCount++;
        const sign = choice === 'want' ? 1 : -1;
        vals.forEach((v, i) => { sum[i] += sign * v; });
      });

      const katastrofa = [];
      const nadoNoNet = [];
      target.forEach((t, i) => {
        const s = sum[i];
        const numVal = Math.abs(s);
        const valStr = (totalCount > 0 ? (numVal / totalCount).toFixed(2) : numVal.toFixed(2));
        const abilityName = flatAbilities[i] ? `${flatAbilities[i].group}: ${flatAbilities[i].name}` : `#${i}`;
        if (t < 0 && s > 0) katastrofa.push({ name: abilityName, val: numVal, valStr, idx: i });
        if (t > 0 && s < 0) nadoNoNet.push({ name: abilityName, val: numVal, valStr, idx: i });
      });
      katastrofa.sort((a, b) => b.val - a.val);
      nadoNoNet.sort((a, b) => b.val - a.val);

      const firstBlockSum = katastrofa.reduce((a, b) => a + b.val, 0);
      const secondBlockSum = nadoNoNet.reduce((a, b) => a + b.val, 0);

      const mode = localStorage.getItem('profiMarketMode') || 'none';
      const p = professions[evalId];
      const market_score = typeof p === 'object' ? (p.market_score ?? 50) : 50;
      const ms = (typeof market_score === 'number' && market_score <= 1) ? market_score * 100 : market_score;
      let marketMult = 1;
      if (mode === 'country') {
        const country = localStorage.getItem('profiMarketCountry') || 'Russia';
        const coeffOverrides = (() => { try { const s = localStorage.getItem('profiCoeffOverrides'); return s ? JSON.parse(s) : {}; } catch (e) { return {}; } })();
        const countryData = coeffOverrides[country] || marketData?.[country] || marketData?.default || {};
        const defaultData = coeffOverrides.default || marketData?.default || {};
        let country_coeff = countryData[evalId] ?? defaultData[evalId] ?? 1.0;
        country_coeff = Math.max(0.2, Math.min(1.0, country_coeff));
        marketMult = ms * country_coeff;
      } else if (mode === 'manual') {
        marketMult = ms;
      }

      const residual = new Array(target.length).fill(0);
      katastrofa.forEach(a => { residual[a.idx] = 1; });
      nadoNoNet.forEach(a => { residual[a.idx] = -1; });
      const hobbyCandidates = [];
      Object.keys(professions).forEach(id => {
        if (!cardData[id] || id === evalId) return;
        const cand = flattenCard(cardData[id]);
        if (!cand) return;
        hobbyCandidates.push({ id, name: getName(professions[id]), dist: dist(residual, cand) });
      });
      hobbyCandidates.sort((a, b) => a.dist - b.dist);
      const topHobbies = hobbyCandidates.slice(0, 2);

      let msDisplay = '—';
      if (mode === 'country') msDisplay = marketMult;
      else if (mode === 'manual') msDisplay = marketMult;
      return { evalId, firstBlockSum, secondBlockSum, marketMult, name: getName(professions[evalId]), market_score: msDisplay, katastrofa, nadoNoNet, topHobbies, sum, target };
    }

    function getTreeOrderIds(professions, ids) {
      const byParent = {};
      ids.forEach(id => {
        const p = professions[id];
        const parentId = (p && typeof p === 'object') ? p.parent : null;
        const parent = (parentId && ids.includes(parentId)) ? parentId : null;
        if (!byParent[parent]) byParent[parent] = [];
        byParent[parent].push(id);
      });
      Object.keys(byParent).forEach(k => byParent[k].sort((a, b) => getName(professions[a]).localeCompare(getName(professions[b]), 'ru')));
      const result = [];
      function walk(parentId) {
        (byParent[parentId] || []).forEach(id => {
          result.push(id);
          walk(id);
        });
      }
      walk(null);
      return result;
    }

    function loadForm() {
      buildFlatAbilities();
      const form = document.getElementById('best-form');
      form.innerHTML = '';
      const professions = profiData.professions;
      const ids = Object.keys(professions).filter(id => cardData[id]);
      const treeIds = getTreeOrderIds(professions, ids);
      let num = 1;
      treeIds.forEach(id => {
        const p = professions[id];
        const isChild = p && p.parent && ids.includes(p.parent);
        const row = document.createElement('div');
        row.className = 'profi-row' + (isChild ? ' profi-row-child' : '');
        row.innerHTML = `
          <span class="profi-name">${num}. ${getName(professions[id])}</span>
          <div class="profi-options">
            <label><input type="radio" name="p${id}" value="want"> хочу</label>
            <label><input type="radio" name="p${id}" value="nowant"> не хочу</label>
            <label><input type="radio" name="p${id}" value="skip" checked> не учитывать</label>
          </div>
        `;
        form.appendChild(row);
        num++;
      });
    }

    function findBest() {
      const professions = profiData.professions;
      const choices = {};
      Object.keys(professions).forEach(id => {
        if (!cardData[id]) return;
        const sel = document.querySelector(`input[name="p${id}"]:checked`);
        if (sel) choices[id] = sel.value;
      });

      const allResults = [];
      Object.keys(professions).forEach(id => {
        if (!cardData[id]) return;
        if (choices[id] === 'nowant') return; // «не хочу» — исключаем из кандидатов
        const res = computeDeltaForProfession(id, choices);
        if (res) allResults.push(res);
      });

      const byFirstBlock = allResults.slice().sort((a, b) => a.firstBlockSum - b.firstBlockSum);
      const top5 = byFirstBlock.slice(0, 5);
      const bySecondBlock = top5.slice().sort((a, b) => a.secondBlockSum - b.secondBlockSum);
      const top3 = bySecondBlock.slice(0, 3);
      const byMarket = top3.slice().sort((a, b) => b.marketMult - a.marketMult);
      const bestRes = byMarket[0] || null;

      const resultEl = document.getElementById('best-result');
      lastBestRes = bestRes;
      if (bestRes) {
        document.getElementById('btn-extra').style.display = 'inline-block';
        const profName = (bestRes.name || '').toUpperCase();
        let html = `<h3>Лучшая профессия для вас: <span class="prof-name">${profName}</span></h3>`;
        const mode = localStorage.getItem('profiMarketMode') || 'none';
        if (mode !== 'none') html += `<p>Востребованность: ${bestRes.market_score}</p>`;
        if (bestRes.katastrofa.length) {
          html += `<div class="fail-block katastrofa"><p class="fail-desc">Если вы решите выбрать профессию <span class="prof-name">${profName}</span>, возможны следующие проблемы. <strong>Некоторую часть способностей, из тех что у вас есть, вам в этой профессии реализовать не удастся</strong> и придётся компенсировать этот избыток через хобби (смотри рекомендации внизу).</p><ul class="fail-list">${bestRes.katastrofa.map(a => `<li>${a.name.replace(/^[^:]+:\s*/, '')} — ${a.valStr}</li>`).join('')}</ul></div>`;
        }
        if (bestRes.nadoNoNet.length) {
          html += `<div class="fail-block nado"><p class="fail-desc">Некоторая часть способностей будет востребована, но как раз <strong>этих способностей у вас мало</strong> — что негативно скажется на ваших успехах в данной профессии.</p><ul class="fail-list">${bestRes.nadoNoNet.map(a => `<li>${a.name.replace(/^[^:]+:\s*/, '')} — ${a.valStr}</li>`).join('')}</ul></div>`;
        }
        if (!bestRes.katastrofa.length && !bestRes.nadoNoNet.length) {
          html += '<div class="fail-block" style="background:#f0fdf4;border-color:#16a34a;"><h4>Всё в порядке</h4><p>Проблем и противоречий нет.</p></div>';
        }
        if (bestRes.topHobbies.length) {
          const hobbyLines = bestRes.topHobbies.map((h, i) => {
            const tochnost = h.dist > 0 ? (1 / h.dist).toFixed(2) : '—';
            return `${i + 1}. <strong>${h.name}</strong> (уверенность ${tochnost})`;
          }).join('<br>');
          html += `<div class="hobby-block"><h4>Наилучшая профессия-хобби</h4><p>${hobbyLines}</p></div>`;
        }
        html += '<a href="index.html" class="home-link">Домой</a>';
        resultEl.innerHTML = html;
        resultEl.style.display = 'block';
      } else {
        document.getElementById('btn-extra').style.display = 'none';
        resultEl.innerHTML = '<h3>Не удалось определить</h3><p>Выберите хочу/не хочу хотя бы для одной профессии.</p><a href="index.html" class="home-link">Домой</a>';
        resultEl.style.display = 'block';
      }
    }

    function showSumModal() {
      if (!lastBestRes || !lastBestRes.sum || !flatAbilities.length) return;
      const ul = document.getElementById('modal-sum-list');
      ul.innerHTML = lastBestRes.sum.map((s, i) => {
        const name = flatAbilities[i] ? `${flatAbilities[i].group}: ${flatAbilities[i].name}` : `#${i}`;
        return `<li><span class="sum-name">${name}</span><span class="sum-val">${s.toFixed(2)}</span></li>`;
      }).join('');
      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function showProfModal() {
      if (!lastBestRes || !lastBestRes.target || !flatAbilities.length) return;
      document.getElementById('prof-modal-title').textContent = 'Параметры профессии: ' + (lastBestRes.name || '');
      const ul = document.getElementById('prof-modal-list');
      ul.innerHTML = lastBestRes.target.map((v, i) => {
        const name = flatAbilities[i] ? `${flatAbilities[i].group}: ${flatAbilities[i].name}` : `#${i}`;
        return `<li><span>${name}</span><span>${v}</span></li>`;
      }).join('');
      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('prof-modal-overlay').style.display = 'flex';
    }

    Promise.all([
      fetch('profi.json').then(r => r.json()).then(mergeProfi),
      fetch('card.json').then(r => r.json()),
      fetch('market.json').then(r => r.json()).catch(() => ({}))
    ])
      .then(([profi, cards, market]) => {
        profiData = profi;
        cardData = cards;
        marketData = market;
        loadForm();
      })
      .catch(() => document.getElementById('best-form').innerHTML = '<p>Ошибка загрузки</p>');

    document.getElementById('btn-find').addEventListener('click', findBest);
    document.getElementById('btn-extra').addEventListener('click', showSumModal);
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('modal-overlay').style.display = 'none';
    });
    document.getElementById('modal-prof').addEventListener('click', showProfModal);
    document.getElementById('prof-modal-close').addEventListener('click', () => {
      document.getElementById('prof-modal-overlay').style.display = 'none';
    });
    document.getElementById('prof-modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'prof-modal-overlay') document.getElementById('prof-modal-overlay').style.display = 'none';
    });
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') document.getElementById('modal-overlay').style.display = 'none';
    });
    (function() {
      function updateBanner() {
        const m = localStorage.getItem('profiMarketMode') || 'none';
        const c = localStorage.getItem('profiMarketCountry') || 'Russia';
        const names = { Russia: 'Россия', Israel: 'Израиль', USA: 'США' };
        const texts = { none: 'Рынок: востребованность не учитывать', country: 'Рынок: ' + (names[c] || c), manual: 'Рынок: востребованность ввести самому' };
        const el = document.getElementById('market-banner');
        if (el) el.innerHTML = '<a href="market.html">' + (texts[m] || texts.none) + '</a>';
      }
      updateBanner();
      window.addEventListener('pageshow', updateBanner);
    })();
  </script>
</body>
</html>
