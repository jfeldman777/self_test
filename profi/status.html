<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Востребованность</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .status-page { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
    .status-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a365d; }
    .back-link { display: inline-block; margin-bottom: 24px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .back-link:hover { text-decoration: underline; }
    .status-table { width: 100%; border-collapse: collapse; }
    .status-table th, .status-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .status-table th { background: #f1f5f9; font-weight: 600; }
    .status-table input { width: 70px; padding: 6px 8px; }
    .btn-save { margin-top: 20px; padding: 12px 24px; background: #16a34a; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .btn-save:hover { background: #15803d; }
    .status-hint { font-size: 0.85rem; color: #64748b; margin-bottom: 16px; }
    .market-banner { margin-bottom: 12px; padding: 8px 12px; background: #e0f2fe; border-radius: 6px; font-size: 0.9rem; }
    .market-banner a { color: #0369a1; font-weight: 500; }
    .home-link { display: inline-block; margin-bottom: 12px; color: #2563eb; text-decoration: none; font-weight: 500; }
    .home-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="status-page">
    <a href="index.html" class="home-link">На главную страницу</a>
    <div id="market-banner" class="market-banner"></div>
    <h1 class="status-title">Востребованность</h1>
    <p class="status-hint">Базовый показатель (market_score): 0–100. Отражает общую рыночную привлекательность профессии.</p>
    <table class="status-table" id="status-table"></table>
    <button type="button" class="btn-save" id="btn-save">Сохранить</button>
  </div>
  <script>
    const STORAGE_KEY = 'profiStatusOverrides';

    function loadOverrides() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        return s ? JSON.parse(s) : {};
      } catch (e) { return {}; }
    }

    function saveOverrides(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function mergeProfi(profi) {
      const overrides = loadOverrides();
      const professions = profi.professions;
      Object.keys(overrides).forEach(id => {
        if (professions[id] && typeof professions[id] === 'object') {
          professions[id].market_score = overrides[id].market_score ?? professions[id].market_score;
        }
      });
      return profi;
    }

    function getTreeOrderIds(professions, ids) {
      const getName = p => typeof p === 'string' ? p : (p && p.name) || '';
      const byParent = {};
      ids.forEach(id => {
        const p = professions[id];
        const parentId = (p && typeof p === 'object') ? p.parent : null;
        const parent = (parentId && ids.includes(parentId)) ? parentId : null;
        if (!byParent[parent]) byParent[parent] = [];
        byParent[parent].push(id);
      });
      Object.keys(byParent).forEach(k => byParent[k].sort((a, b) => getName(professions[a]).localeCompare(getName(professions[b]), 'ru')));
      const result = [];
      function walk(parentId) {
        (byParent[parentId] || []).forEach(id => {
          result.push(id);
          walk(id);
        });
      }
      walk(null);
      return result;
    }

    fetch('profi.json').then(r => r.json())
      .then(profi => {
        mergeProfi(profi);
        const professions = profi.professions;
        const ids = Object.keys(professions);
        const treeIds = getTreeOrderIds(professions, ids);

        const tbody = treeIds.map(id => {
          const p = professions[id];
          const name = typeof p === 'string' ? p : p.name;
          const ms = typeof p === 'object' ? (p.market_score ?? 50) : 50;
          const v = (typeof ms === 'number' && ms <= 1) ? ms * 100 : ms;
          return `<tr data-id="${id}">
            <td>${name}</td>
            <td><input type="number" min="0" max="100" step="1" value="${v}" data-field="market_score"></td>
          </tr>`;
        }).join('');

        document.getElementById('status-table').innerHTML = `
          <thead><tr><th>Профессия</th><th>market_score (0–100)</th></tr></thead>
          <tbody>${tbody}</tbody>
        `;

        document.getElementById('btn-save').addEventListener('click', () => {
          const overrides = {};
          document.querySelectorAll('#status-table tbody tr').forEach(tr => {
            const id = tr.dataset.id;
            const v = parseFloat(tr.querySelector('[data-field="market_score"]').value);
            overrides[id] = { market_score: Math.max(0, Math.min(100, isNaN(v) ? 50 : v)) };
          });
          saveOverrides(overrides);
          alert('Сохранено. Изменения применятся при следующей загрузке страниц.');
        });
      })
      .catch(() => document.getElementById('status-table').innerHTML = '<tr><td colspan="2">Ошибка загрузки</td></tr>');
    (function() {
      function updateBanner() {
        const m = localStorage.getItem('profiMarketMode') || 'none';
        const c = localStorage.getItem('profiMarketCountry') || 'Russia';
        const names = { Russia: 'Россия', Israel: 'Израиль', USA: 'США' };
        const texts = { none: 'Рынок: востребованность не учитывать', country: 'Рынок: ' + (names[c] || c), manual: 'Рынок: востребованность ввести самому' };
        const el = document.getElementById('market-banner');
        if (el) el.innerHTML = '<a href="market.html">' + (texts[m] || texts.none) + '</a>';
      }
      updateBanner();
      window.addEventListener('pageshow', updateBanner);
    })();
  </script>
</body>
</html>
