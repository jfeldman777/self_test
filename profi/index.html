<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профессии</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .profi-page { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .profi-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a365d; }
    .profi-title a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .profi-title a:hover { text-decoration: underline; }
    .profi-list { list-style: none; padding: 0; margin: 0; }
    .profi-list li { margin-bottom: 16px; }
    .profi-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 20px; background: #f8f9fa; border: 2px solid #2563eb; border-radius: 8px;
      flex-wrap: wrap;
    }
    .profi-item-name { font-weight: 500; flex: 1; min-width: 180px; }
    .profi-item-child { position: relative; margin-left: 14px; padding-left: 8px; }
    .profi-item-child::before { content: ''; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 2px; background: #94a3b8; border-radius: 1px; }
    .profi-btns { display: flex; gap: 8px; }
    .profi-btn {
      padding: 8px 16px; border-radius: 6px; font-weight: 500; text-decoration: none;
      font-size: 0.9rem; transition: background 0.2s;
    }
    .profi-btn-study { background: #2563eb; color: white; border: none; }
    .profi-btn-study:hover { background: #1d4ed8; }
    .profi-btn-eval { background: #16a34a; color: white; border: none; }
    .profi-btn-eval:hover { background: #15803d; }
    .market-banner { margin-bottom: 12px; padding: 8px 12px; background: #e0f2fe; border-radius: 6px; font-size: 0.9rem; }
    .market-banner a { color: #0369a1; font-weight: 500; }
  </style>
</head>
<body>
  <div class="profi-page">
    <div id="market-banner" class="market-banner"></div>
    <h1 class="profi-title">ПРОФЕССИИ — <a href="help.html">Как это работает</a> — <a href="market.html">Рынок</a> — <a href="best.html">ЛУЧШАЯ ПРОФЕССИЯ</a></h1>
    <ul class="profi-list" id="profi-list"></ul>
  </div>
  <script>
    const STORAGE_KEY = 'profiStatusOverrides';
    function mergeCardIntoProfi(profi, cards) {
      if (!cards) return;
      if (!profi.professions) profi.professions = {};
      Object.keys(cards).forEach(id => {
        const card = cards[id];
        profi.professions[id] = { name: card.name, market_score: card.market_score ?? 50 };
        if (card.parent !== undefined) profi.professions[id].parent = card.parent;
      });
    }
    function mergeProfi(profi) {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        const overrides = s ? JSON.parse(s) : {};
        Object.keys(overrides).forEach(id => {
          if (profi.professions[id] && typeof profi.professions[id] === 'object') {
            profi.professions[id].market_score = overrides[id].market_score ?? profi.professions[id].market_score;
          }
        });
      } catch (e) {}
      return profi;
    }
    function getTreeOrderIds(professions, ids) {
      const getName = p => typeof p === 'string' ? p : (p && p.name) || '';
      const byParent = {};
      ids.forEach(id => {
        const p = professions[id];
        const parentId = (p && typeof p === 'object') ? p.parent : null;
        const parent = (parentId && ids.includes(parentId)) ? parentId : null;
        if (!byParent[parent]) byParent[parent] = [];
        byParent[parent].push(id);
      });
      Object.keys(byParent).forEach(k => byParent[k].sort((a, b) => getName(professions[a]).localeCompare(getName(professions[b]), 'ru')));
      const result = [];
      function walk(parentId) {
        (byParent[parentId] || []).forEach(id => {
          result.push(id);
          walk(id);
        });
      }
      walk(null);
      return result;
    }

    Promise.all([fetch('profi.json').then(r => r.json()), fetch('card.json').then(r => r.json())])
      .then(([profi, cards]) => {
        mergeCardIntoProfi(profi, cards);
        mergeProfi(profi);
        const ul = document.getElementById('profi-list');
        const professions = profi.professions;
        const getName = p => typeof p === 'string' ? p : p.name;
        const ids = Object.keys(professions).filter(id => cards[id]);
        const treeIds = getTreeOrderIds(professions, ids);
        let num = 1;
        treeIds.forEach(id => {
            const p = professions[id];
            const isChild = p && p.parent && ids.includes(p.parent);
            const li = document.createElement('li');
            li.innerHTML = `
              <div class="profi-item ${isChild ? 'profi-item-child' : ''}">
                <span class="profi-item-name">${num}. ${getName(professions[id])}</span>
                <div class="profi-btns">
                  <a href="card.html?id=${id}" class="profi-btn profi-btn-study" title="Проверить мое понимание профессии">Изучить</a>
                  <a href="want.html?eval=${id}" class="profi-btn profi-btn-eval" title="Оценить подходит ли профессия для меня">Оценить</a>
                </div>
              </div>
            `;
            ul.appendChild(li);
          num++;
        });
      })
      .catch(() => document.getElementById('profi-list').innerHTML = '<li>Ошибка загрузки</li>');
    (function() {
      function updateBanner() {
        const m = localStorage.getItem('profiMarketMode') || 'none';
        const c = localStorage.getItem('profiMarketCountry') || 'Russia';
        const names = { Russia: 'Россия', Israel: 'Израиль', USA: 'США' };
        const texts = { none: 'Рынок: востребованность не учитывать', country: 'Рынок: ' + (names[c] || c), manual: 'Рынок: востребованность ввести самому' };
        const el = document.getElementById('market-banner');
        if (el) el.innerHTML = '<a href="market.html">' + (texts[m] || texts.none) + '</a>';
      }
      updateBanner();
      window.addEventListener('pageshow', updateBanner);
    })();
  </script>
</body>
</html>
