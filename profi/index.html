<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профессии</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .profi-page { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .profi-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #1a365d; }
    .profi-title a { color: #2563eb; text-decoration: none; font-weight: 500; }
    .profi-title a:hover { text-decoration: underline; }
    .profi-list { list-style: none; padding: 0; margin: 0; }
    .profi-list li { margin-bottom: 16px; }
    .profi-item {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 16px 20px; background: #f8f9fa; border: 2px solid #2563eb; border-radius: 8px;
      flex-wrap: wrap;
    }
    .profi-item-name { font-weight: 500; flex: 1; min-width: 180px; }
    .profi-btns { display: flex; gap: 8px; }
    .profi-btn {
      padding: 8px 16px; border-radius: 6px; font-weight: 500; text-decoration: none;
      font-size: 0.9rem; transition: background 0.2s;
    }
    .profi-btn-study { background: #2563eb; color: white; border: none; }
    .profi-btn-study:hover { background: #1d4ed8; }
    .profi-btn-eval { background: #16a34a; color: white; border: none; }
    .profi-btn-eval:hover { background: #15803d; }
  </style>
</head>
<body>
  <div class="profi-page">
    <h1 class="profi-title">ПРОФЕССИИ — <a href="help.html">Как это работает</a> — <a href="status.html">Статус и зарплата</a> — <a href="best.html">ЛУЧШАЯ ПРОФЕССИЯ</a></h1>
    <ul class="profi-list" id="profi-list"></ul>
  </div>
  <script>
    const STORAGE_KEY = 'profiStatusOverrides';
    function mergeProfi(profi) {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        const overrides = s ? JSON.parse(s) : {};
        Object.keys(overrides).forEach(id => {
          if (profi.professions[id] && typeof profi.professions[id] === 'object') {
            profi.professions[id].status = overrides[id].status ?? profi.professions[id].status;
            profi.professions[id].salary = overrides[id].salary ?? profi.professions[id].salary;
          }
        });
      } catch (e) {}
      return profi;
    }
    Promise.all([fetch('profi.json').then(r => r.json()).then(mergeProfi), fetch('card.json').then(r => r.json())])
      .then(([profi, cards]) => {
        const ul = document.getElementById('profi-list');
        const professions = profi.professions;
        const getName = p => typeof p === 'string' ? p : p.name;
        const ids = Object.keys(professions).filter(id => cards[id]).sort((a, b) => getName(professions[a]).localeCompare(getName(professions[b]), 'ru'));
        let num = 1;
        ids.forEach(id => {
            const li = document.createElement('li');
            li.innerHTML = `
              <div class="profi-item">
                <span class="profi-item-name">${num}. ${getName(professions[id])}</span>
                <div class="profi-btns">
                  <a href="card.html?id=${id}" class="profi-btn profi-btn-study" title="Проверить мое понимание профессии">Изучить</a>
                  <a href="want.html?eval=${id}" class="profi-btn profi-btn-eval" title="Оценить подходит ли профессия для меня">Оценить</a>
                </div>
              </div>
            `;
            ul.appendChild(li);
          num++;
        });
      })
      .catch(() => document.getElementById('profi-list').innerHTML = '<li>Ошибка загрузки</li>');
  </script>
</body>
</html>
